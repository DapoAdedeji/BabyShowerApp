<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Leaderboard — Dapo & Desola's Baby Shower</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="floaty-bg" aria-hidden="true">
    <span>🏆</span><span>⭐</span><span>🍼</span><span>🥇</span><span>🧸</span><span>🏆</span><span>⭐</span><span>🍼</span>
  </div>

  <!-- ===================== SETUP SCREEN (first visit, or Edit Teams) ===================== -->
  <section id="screen-setup" class="screen active">
    <div class="setup-card">
      <a href="../index.html#menu" class="back-link">← Back to Menu</a>
      <h1>Who's playing today? 🏆</h1>
      <p class="setup-sub">Register your teams here first — every game in the app will use this same lineup.</p>

      <h2>Teams</h2>
      <div id="team-inputs" class="team-inputs"></div>
      <div class="team-count-controls">
        <button id="btn-remove-team" class="btn-round" aria-label="Remove team">−</button>
        <span id="team-count-label">4 teams</span>
        <button id="btn-add-team" class="btn-round" aria-label="Add team">+</button>
      </div>

      <button id="btn-start-session" class="btn-primary">Start Session 🎉</button>
    </div>
  </section>

  <!-- ===================== LEAGUE TABLE SCREEN ===================== -->
  <section id="screen-table" class="screen">
    <div class="league-card">
      <a href="../index.html#menu" class="back-link">← Back to Menu</a>
      <h1>🏆 Leaderboard</h1>
      <p class="league-sub">Running scores across every game today</p>

      <div id="league-table" class="league-table"></div>

      <div class="league-actions">
        <button id="btn-edit-scores" class="btn-primary">✏️ Edit Scores</button>
        <button id="btn-reset-scores" class="btn-ghost">🔄 Reset Scores</button>
        <button id="btn-edit-teams" class="btn-ghost">👥 Edit Teams (resets scores)</button>
        <button id="btn-reset-all" class="btn-ghost">🗑️ Reset Everything</button>
      </div>
    </div>
  </section>

  <script src="../session.js"></script>
  <script src="../score-editor.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
