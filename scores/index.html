<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Leaderboard — Dapo & Desola's Baby Shower</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏆</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="floaty-bg" aria-hidden="true">
    <span>🏆</span><span>⭐</span><span>🍼</span><span>🥇</span><span>🧸</span><span>🏆</span><span>⭐</span><span>🍼</span>
  </div>

  <!-- VIEW ONLY: no editing or resetting here — the hosts run scores from the admin app. -->
  <section class="screen active">
    <div class="league-card">
      <a href="/#menu" class="back-link">← Back</a>
      <h1>🏆 Leaderboard</h1>
      <p class="league-sub">Running scores across every game today</p>

      <div id="league-table" class="league-table" aria-live="polite"></div>
      <p id="league-empty" class="league-empty" hidden>The teams haven't been set up yet — check back once the games start! 🎈</p>
      <p id="league-status" class="league-status"><span class="live-dot" aria-hidden="true"></span><span id="league-status-text">Loading…</span></p>
    </div>
  </section>

  <script src="leaderboard.js"></script>
</body>
</html>
