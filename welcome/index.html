<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Welcome — Dapo & Desola's Baby Shower</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👶</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="floaty-bg" aria-hidden="true">
    <span>🍼</span><span>🧸</span><span>👶</span><span>🌙</span><span>⭐</span><span>🎈</span><span>🧸</span><span>👶</span>
  </div>

  <section class="screen active">
    <div class="welcome-card signin-card">
      <p class="eyebrow">You're invited to</p>
      <h1 class="welcome-title signin-title"><span class="names">Dapo &amp; Desola's</span><br/>Baby Shower</h1>

      <p id="signed-in-note" class="signed-in-note" hidden></p>

      <form id="signin-form" novalidate>
        <fieldset class="role-fieldset">
          <legend class="signin-question">What would you like to sign in as?</legend>
          <div class="role-grid">
            <label class="role-option">
              <input type="radio" name="role" value="guest" />
              <span class="role-card">
                <span class="role-icon" aria-hidden="true">🎉</span>
                <span class="role-name">Guest</span>
                <span class="role-desc">Play Guess That Baby &amp; follow the scores</span>
              </span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="admin" />
              <span class="role-card">
                <span class="role-icon" aria-hidden="true">🔑</span>
                <span class="role-name">Admin</span>
                <span class="role-desc">Run the games &amp; manage everything</span>
              </span>
            </label>
          </div>
        </fieldset>

        <div id="password-step" class="password-step" hidden>
          <label class="field-label-center" for="password" id="password-label">Password</label>
          <input id="password" class="signin-input" type="password" autocomplete="current-password" />
          <p id="signin-error" class="signin-error" role="alert"></p>
          <button id="btn-signin" type="submit" class="btn-primary">Sign in →</button>
        </div>
      </form>
    </div>
  </section>

  <script src="welcome.js"></script>
</body>
</html>
