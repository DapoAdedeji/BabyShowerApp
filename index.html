<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dapo & Desola's Baby Shower</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👶</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="floaty-bg" aria-hidden="true">
    <span>🍼</span><span>🧸</span><span>👶</span><span>🌙</span><span>⭐</span><span>🎈</span><span>🧸</span><span>👶</span>
  </div>

  <!-- ===================== WELCOME SCREEN ===================== -->
  <section id="screen-welcome" class="screen active">
    <div class="welcome-card">
      <p class="eyebrow">You're invited to</p>
      <h1 class="welcome-title">Welcome to<br/><span class="names">Dapo &amp; Desola's</span><br/>Baby Shower!</h1>
      <p class="welcome-subtitle">So glad you're here to celebrate with us 🍼</p>
      <button id="btn-enter" class="btn-primary">Let's Celebrate →</button>
    </div>
  </section>

  <!-- ===================== MENU SCREEN ===================== -->
  <section id="screen-menu" class="screen">
    <div class="menu-wrap">
      <h1 class="menu-title">What shall we do? 🎉</h1>
      <p class="menu-subtitle">Pick an activity below</p>

      <div class="menu-grid">
        <a class="menu-tile" href="guess-that-baby/">
          <span class="tile-icon">👶</span>
          <span class="tile-title">Guess That Baby</span>
          <span class="tile-tag">Coming soon</span>
        </a>

        <a class="menu-tile" href="leaderboard/">
          <span class="tile-icon">🏆</span>
          <span class="tile-title">Leaderboard</span>
          <span class="tile-tag">See the scores!</span>
        </a>

        <a class="menu-tile live" href="jeopardy/">
          <span class="tile-icon">❓</span>
          <span class="tile-title">Baby Jeopardy</span>
          <span class="tile-tag">Let's play!</span>
        </a>

        <a class="menu-tile" href="karaoke/">
          <span class="tile-icon">🎤</span>
          <span class="tile-title">Baby Karaoke</span>
          <span class="tile-tag">Coming soon</span>
        </a>
      </div>

      <div class="hub-signout">
        <button type="button" class="btn-ghost signout-btn" data-signout>Sign out</button>
      </div>
    </div>
  </section>

  <script src="/signout.js"></script>
  <script src="app.js"></script>
</body>
</html>
